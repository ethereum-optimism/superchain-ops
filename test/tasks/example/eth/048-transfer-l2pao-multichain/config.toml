# Multichain L2 ProxyAdmin ownership transfer: transfers the L2 ProxyAdmin of Mode, Metal,
# Zora and Dust to the alias of the operator's designated Safe in a single task, via each
# chain's L1 OptimismPortal. Dust (chain ID 55378) is not part of the Superchain Registry,
# so its addresses are provided via the fallback addresses JSON file.
l2chains = [
    {name = "Mode", chainId = 34443},
    {name = "Metal", chainId = 1750},
    {name = "Zora", chainId = 7777777},
    {name = "Dust", chainId = 55378}
]
fallbackAddressesJsonPath = "test/tasks/example/eth/048-transfer-l2pao-multichain/addresses.json"
templateName = "TransferL2PAOFromL1"

# The new owner address to alias: the operator's designated mainnet Safe.
newOwnerToAlias = "0x4a4962275DF8C60a80d3a25faEc5AA7De116A746"

