# Example task for SetL1SplitterConfig, leg B: the L1PAO accepts ownership of the Unichain
# L1Splitter and updates its recipient, minimum and interval in one batch of portal deposits.
# The pending-owner transfer (leg A) is simulated on the L2 pre-flight fork. Synthetic values;
# this is a test, not a real handover.

templateName = "SetL1SplitterConfig"

l2chains = [
    {name = "Unichain", chainId = 130}
]

l1Splitter = "0x4300c0d3c0d3c0D3c0d3C0D3c0d3C0D3C0D30003"
l2RpcUrl = "https://mainnet.unichain.org"

acceptOwnership = true
simulatePendingOwnerTransfer = true

l1Recipient = "0x000000000000000000000000000000000000dEaD"
minWithdrawalAmount = "1000000000000000000"
feeDisbursementInterval = 3600

