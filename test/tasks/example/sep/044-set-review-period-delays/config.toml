templateName = "SetReviewPeriodDelays"

# Both devnets share ProxyAdminOwner 0xe934Dc97E347C6aCef74364B50125bb8689c40ff, which L2TaskBase
# resolves as the root safe. List every chain of an interop set in one task so the shared
# AnchorStateRegistry is written once and the proof maturity uniformity check sees all members.
l2chains = [
    {name = "sepolia-devnet-2", chainId = 420130015},
    {name = "sepolia-devnet-3", chainId = 420130018}
]

# Both keys are optional; omit one to leave that delay untouched. Values are seconds and must sit
# within each contract's [min, max] (standard bounds: proof maturity [86400, 604800], finality delay
# [43200, 302400]).
[delays]
proofMaturityDelaySeconds = 172800
disputeGameFinalityDelaySeconds = 86400
