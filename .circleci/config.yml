version: 2.1

orbs:
  utils: ethereum-optimism/circleci-utils@1.0.33
  slack: circleci/slack@4.10.1
  github-cli: circleci/github-cli@2.7.0

executors:
  default:
    machine:
      image: ubuntu-2204:2024.08.1

parameters:
  default_docker_image:
    type: string
    default: cimg/base:2024.01
  github-event-type:
    type: string
    default: "__not_set__"
  github-event-action:
    type: string
    default: "__not_set__"
  github-event-base64:
    type: string
    default: "__not_set__"

commands:
  notify-failures-on-main:
    description: "Notify Slack"
    parameters:
      channel:
        type: string
        default: C03N11M0BBN
      mentions:
        type: string
        default: ""
    steps:
      - slack/notify:
          channel: << parameters.channel >>
          event: fail
          template: basic_fail_1
          branch_pattern: main
          mentions: "<< parameters.mentions >>"

  github-checkout:
    description: "Check out the repo over HTTPS. Uses a read-only GitHub App installation token when the github-checkout-app-superchain-ops context is set, otherwise clones anonymously."
    parameters:
      method:
        description: "Clone method: full or blobless (blob:none filter)."
        type: enum
        enum: ["full", "blobless"]
        default: "full"
    steps:
      - run:
          name: Check out code
          environment:
            CHECKOUT_METHOD: << parameters.method >>
          command: |
            set -euo pipefail

            : "${CIRCLE_SHA1:?CIRCLE_SHA1 is not set}"

            repo_slug="${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
            repo_url="https://github.com/${repo_slug}.git"
            token=""
            basic=""

            have_tools() {
              for tool in openssl curl jq; do
                command -v "$tool" >/dev/null 2>&1 || return 1
              done
            }

            if [ -n "${GITHUB_CHECKOUT_APP_ID:-}" ] && [ -n "${GITHUB_CHECKOUT_APP_PRIVATE_KEY_B64:-}" ] && have_tools; then
              key_file="$(mktemp)"
              trap 'rm -f "$key_file"' EXIT
              printf '%s' "$GITHUB_CHECKOUT_APP_PRIVATE_KEY_B64" | base64 -d > "$key_file"
              b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
              now=$(date +%s)
              header=$(printf '{"alg":"RS256","typ":"JWT"}' | b64url)
              payload=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$((now - 60))" "$((now + 540))" "$GITHUB_CHECKOUT_APP_ID" | b64url)
              signature=$(printf '%s.%s' "$header" "$payload" | openssl dgst -sha256 -sign "$key_file" -binary | b64url)
              jwt="$header.$payload.$signature"
              installation_id=$(curl -fsSL --retry 3 \
                -H "Authorization: Bearer $jwt" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${repo_slug}/installation" | jq -r '.id')
              if [ -z "$installation_id" ] || [ "$installation_id" = "null" ]; then
                echo "Failed to resolve GitHub App installation id" >&2
                exit 1
              fi
              token_body=$(jq -n --arg repo "$CIRCLE_PROJECT_REPONAME" '{repositories: [$repo], permissions: {contents: "read"}}')
              token=$(curl -fsSL --retry 3 -X POST \
                -H "Authorization: Bearer $jwt" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                -d "$token_body" \
                "https://api.github.com/app/installations/${installation_id}/access_tokens" | jq -r '.token')
              if [ -z "$token" ] || [ "$token" = "null" ]; then
                echo "Failed to mint GitHub App installation token" >&2
                exit 1
              fi
              basic=$(printf 'x-access-token:%s' "$token" | base64 | tr -d '\n')
              export GIT_CONFIG_COUNT=1
              export GIT_CONFIG_KEY_0="http.${repo_url}.extraheader"
              export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${basic}"
            elif [ -n "${GITHUB_CHECKOUT_APP_ID:-}" ] || [ -n "${GITHUB_CHECKOUT_APP_PRIVATE_KEY_B64:-}" ]; then
              echo "GitHub App checkout credentials are incomplete or openssl, curl and jq are missing, checking out anonymously" >&2
            fi

            fetch_repo() {
              if [ "$CHECKOUT_METHOD" = "blobless" ]; then
                git fetch --filter=blob:none "$@"
              else
                git fetch "$@"
              fi
            }

            if [ ! -e .git ]; then
              git init -q
            fi

            if git remote get-url origin >/dev/null 2>&1; then
              git remote set-url origin "$repo_url"
            else
              git remote add origin "$repo_url"
            fi

            if [ -n "$token" ]; then
              echo "Checking out with GitHub App token"
            else
              echo "Checking out anonymously"
            fi

            fetch_repo --quiet --force --tags origin '+refs/heads/*:refs/remotes/origin/*'
            fetch_repo --quiet origin "$CIRCLE_SHA1"

            if [ -n "${CIRCLE_BRANCH:-}" ]; then
              git checkout --force -B "$CIRCLE_BRANCH" "$CIRCLE_SHA1"
            else
              git checkout --force "$CIRCLE_SHA1"
            fi

            if [ "$(git rev-parse HEAD)" != "$CIRCLE_SHA1" ]; then
              echo "HEAD $(git rev-parse HEAD) does not match CIRCLE_SHA1 ${CIRCLE_SHA1}" >&2
              exit 1
            fi

            if [ -n "${CIRCLE_TAG:-}" ]; then
              if ! git rev-parse -q --verify "refs/tags/${CIRCLE_TAG}" >/dev/null; then
                echo "Tag ${CIRCLE_TAG} not found" >&2
                exit 1
              fi
            fi
  checkout-with-mise:
    description: "Checkout then initialize the mise environment."
    parameters:
      checkout-method:
        type: enum
        enum:
          - blobless
          - full
        default: full
      enable-mise-cache:
        type: boolean
        default: false
      mise-cache-key-prefix:
        type: string
        default: "mise-cache"
      mise-cache-checksum:
        type: string
        default: '{{ checksum "mise.toml" }}'
      fresh-install:
        description: Skip every mise cache and install mise and all tools fresh. See install-mise's fresh_install.
        type: boolean
        default: false
    steps:
      - github-checkout:
          method: << parameters.checkout-method >>
      - utils/install-mise:
          enable_mise_cache: << parameters.enable-mise-cache >>
          mise_cache_key_prefix: << parameters.mise-cache-key-prefix >>
          mise_cache_checksum: << parameters.mise-cache-checksum >>
          fresh_install: << parameters.fresh-install >>

  init-submodules-shallow:
    description: >-
      Check out submodules at depth 1, in parallel. Without this, forge build auto-runs forge install, which clones
      every submodule's full history (lib/optimism is the entire monorepo).
    steps:
      - run:
          name: Init submodules (shallow)
          command: git submodule update --init --recursive --depth 1 --jobs 8

  restore-forge-artifacts:
    description: >-
      Restore out/ and cache/ from an earlier build. Foundry's cache is content-hashed, so unchanged sources skip
      compilation even after a fresh checkout; on a partial (prefix) hit only changed files and their dependents are
      recompiled. forge_build still compiles from scratch, so a clean build stays covered.
    steps:
      - run:
          name: Compute forge artifact cache key
          # Blob hashes of every tracked Solidity file and compiler/toolchain config, plus the submodule commits.
          command: git ls-files -s -- '*.sol' foundry.toml mise.toml lib > /tmp/forge-artifacts-key
      - restore_cache:
          keys:
            - forge-artifacts-v1-{{ checksum "/tmp/forge-artifacts-key" }}
            - forge-artifacts-v1-

  save-forge-artifacts:
    steps:
      - save_cache:
          key: forge-artifacts-v1-{{ checksum "/tmp/forge-artifacts-key" }}
          paths:
            - out
            - cache

jobs:
  check_task_statuses:
    docker:
      - image: <<pipeline.parameters.default_docker_image>>
    steps:
      - checkout-with-mise
      - attach_workspace:
          at: .
      - run:
          name: Check task statuses
          command: bash ./src/script/check-task-statuses.sh

  check_superchain_registry:
    docker:
      - image: <<pipeline.parameters.default_docker_image>>
    steps:
      - checkout-with-mise
      - attach_workspace:
          at: .
      - run:
          name: Check superchain registry
          command: |
            just install
            (cd src/ && just --justfile ci.just check-superchain-registry-latest)
      - notify-failures-on-main:
          mentions: "<!subteam^S07K486JEH4>"

  stacked_simulation:
    description: "Runs a stacked simulation"
    parameters:
      network:
        type: string
      mentions:
        type: string
        default: "<!subteam^S07K486JEH4>"
    docker:
      - image: <<pipeline.parameters.default_docker_image>>
    resource_class: xlarge
    environment:
      FOUNDRY_PROFILE: ci
    steps:
      - checkout-with-mise
      - run:
          name: "Run stacked simulation for network: <<parameters.network>>"
          # This may need to be increased in the future. We should focus on fixing the performance first before bumping this.
          no_output_timeout: 30m
          command: |
            just install
            cd src/
            just simulate-stack <<parameters.network>> > stack-simulation-output.txt
      - store_artifacts:
          path: src/stack-simulation-output.txt
      - notify-failures-on-main:
          mentions: "<< parameters.mentions >>"

  forge_build:
    docker:
      - image: <<pipeline.parameters.default_docker_image>>
    steps:
      - checkout-with-mise
      - run:
          name: forge build
          command: |
            just install
            forge --version
            forge build --deny-warnings

  forge_fmt:
    docker:
      - image: <<pipeline.parameters.default_docker_image>>
    steps:
      - checkout-with-mise
      - run:
          name: forge fmt
          command: |
            just install
            forge --version
            forge fmt --check

  forge_test:
    docker:
      - image: <<pipeline.parameters.default_docker_image>>
    resource_class: xlarge
    environment:
      FOUNDRY_PROFILE: ci
    steps:
      - checkout-with-mise
      - run:
          name: forge test
          max_auto_reruns: 3
          auto_rerun_delay: 10s
          command: |
            just install
            forge --version
            # Skip integration tests - they require RPC endpoints for L1/L2 fork simulation, and for now the unique
            # test we have is for revenue sharing and is not the standard way of testing, for now we are excluding it
            # from the CI.
            # Run manually with: forge test --match-contract Integration
            forge test --skip Integration -vvv
      - notify-failures-on-main:
          mentions: "<!subteam^S07K486JEH4>"

  template_regression_tests:
    docker:
      - image: <<pipeline.parameters.default_docker_image>>
    environment:
      FOUNDRY_PROFILE: ci
    steps:
      - checkout-with-mise
      - init-submodules-shallow
      - restore-forge-artifacts
      - run:
          name: forge build
          command: forge build
      # Saved before simulating so a flaky simulation doesn't discard a warm build.
      - save-forge-artifacts
      - run:
          name: Make sure all templates can be simulated.
          max_auto_reruns: 3
          auto_rerun_delay: 10s
          command: |
            (cd src/ && just --justfile ci.just simulate-all-templates)
      - notify-failures-on-main:
          mentions: "<!subteam^S07K486JEH4>"

  just_new_recipe_tests:
    docker:
      - image: <<pipeline.parameters.default_docker_image>>
    steps:
      - checkout-with-mise
      - run:
          name: just new recipe tests
          command: (cd src/ && bash ../test/script/test-just-new.sh)

  print_versions:
    docker:
      - image: <<pipeline.parameters.default_docker_image>>
    steps:
      - checkout-with-mise
      - run:
          name: print versions
          command: |
            just --version
            yq --version
            forge --version

  shellcheck:
    docker:
      - image: <<pipeline.parameters.default_docker_image>>
    steps:
      - checkout-with-mise
      - run:
          name: shellcheck
          command:
            | # Justfiles are not shell scripts and should not be checked with shellcheck
            (cd src/script && shellcheck -x *.sh)
  # Check that all task directories have valid names and there are no duplicate prefixes.
  check_task_names:
    docker:
      - image: <<pipeline.parameters.default_docker_image>>
    steps:
      - checkout-with-mise
      - run:
          name: check task names
          command: (cd src/script && ./check-task-names.sh)
  # Check that structs used with JSON/TOML parseRaw have alphabetically ordered fields.
  # This prevents a subtle bug where Foundry's parseRaw orders keys alphabetically,
  # causing abi.decode to assign values to wrong fields if struct fields aren't sorted. See:
  # https://getfoundry.sh/reference/cheatcodes/parse-toml/#decoding-toml-tables-into-solidity-structs
  check_struct_order:
    docker:
      - image: <<pipeline.parameters.default_docker_image>>
    steps:
      - checkout-with-mise
      - run:
          name: check struct field ordering
          command: (cd src/script && ./check-struct-order.sh)
  check_task_pr_simulation:
    docker:
      - image: <<pipeline.parameters.default_docker_image>>
    steps:
      - github-checkout
      - github-cli/install
      - run:
          name: Check task PR simulation confirmation
          command: |
            # Skip if not a PR
            if [ -z "$CIRCLE_PULL_REQUEST" ]; then
              echo "Not a PR, skipping task PR validation."
              exit 0
            fi

            # Extract PR number from URL
            PR_NUMBER=$(echo "$CIRCLE_PULL_REQUEST" | grep -oE '[0-9]+$')
            if [ -z "$PR_NUMBER" ]; then
              echo "Could not extract PR number, skipping."
              exit 0
            fi

            # Check if PR touches task files
            CHANGED_FILES=$(git diff --name-only origin/main...HEAD 2>/dev/null || git diff --name-only HEAD~1)
            if ! echo "$CHANGED_FILES" | grep -q "^src/tasks/"; then
              echo "PR does not modify src/tasks/, skipping task PR validation."
              exit 0
            fi

            # Check if only README files are modified in src/tasks/
            TASK_FILES=$(echo "$CHANGED_FILES" | grep "^src/tasks/")
            NON_README_TASK_FILES=$(echo "$TASK_FILES" | grep -v -i "readme\.md$" || true)
            
            if [ -z "$NON_README_TASK_FILES" ]; then
              echo "PR only modifies README files in src/tasks/, skipping simulation validation."
              exit 0
            fi

            echo "PR modifies non-README files in src/tasks/, checking simulation confirmation..."

            # Fetch PR body
            export GH_TOKEN="$GITHUB_TOKEN"
            PR_BODY=$(gh pr view "$PR_NUMBER" --repo "${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}" --json body -q '.body')

            MISSING=""

            # Check for simulation run confirmation
            if ! echo "$PR_BODY" | grep -q "\[x\] I have run a Tenderly simulation"; then
              MISSING="$MISSING\n- 'I have run a Tenderly simulation' is not checked"
            fi

            # Check for simulation review confirmation
            if ! echo "$PR_BODY" | grep -q "\[x\] I have reviewed and understand all state changes"; then
              MISSING="$MISSING\n- 'I have reviewed and understand all state changes' is not checked"
            fi

            # Check for state changes match confirmation
            if ! echo "$PR_BODY" | grep -q "\[x\] All state changes match the expected behavior"; then
              MISSING="$MISSING\n- 'All state changes match the expected behavior' is not checked"
            fi

            # Check for explanation confirmation
            if ! echo "$PR_BODY" | grep -q "\[x\] I can explain every state diff"; then
              MISSING="$MISSING\n- 'I can explain every state diff' is not checked"
            fi

            if [ -n "$MISSING" ]; then
              echo ""
              echo "=============================================="
              echo "ERROR: Task PR simulation checklist incomplete"
              echo "=============================================="
              echo ""
              echo "This PR modifies files in src/tasks/ and requires simulation verification."
              echo ""
              echo "Missing confirmations:"
              echo -e "$MISSING"
              echo ""
              echo "Please update your PR description to check all required boxes in the"
              echo "'Simulation Checklist' section of the PR template."
              echo ""
              echo "Template: .github/pull_request_template.md"
              echo "Guide: docs/NEW_TASK_GUIDE.md"
              echo ""
              exit 1
            fi

            echo "Task PR validation passed!"

  close-issue:
    machine:
      image: ubuntu-2204:2024.08.1
    parameters:
      label_name:
        type: string
      message:
        type: string
    steps:
      - github-cli/install
      - utils/github-event-handler-setup:
          github_event_base64: << pipeline.parameters.github-event-base64 >>
          env_prefix: "github_"
      - run:
          name: Close issue if label is added
          command: |
            echo "Closing issue $github_pull_request_number if label $github_label_name is added on repository ${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}"
            if [ ! -z "$github_pull_request_number" ] && [ "$github_label_name" = "$LABEL_NAME" ]; then
                export GH_TOKEN=$GITHUB_TOKEN_GOVERNANCE
                gh issue close --repo "${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}" "$github_pull_request_number" --comment "$MESSAGE"
            fi
          environment:
            MESSAGE: << parameters.message >>
            LABEL_NAME: << parameters.label_name >>

workflows:
  main:
    when:
      or:
        # Trigger on new commits
        - equal: [webhook, << pipeline.trigger_source >>]
        - equal: ["build_four_hours", <<pipeline.schedule.name>>]
    jobs:
      - print_versions:
          context:
            - circleci-repo-readonly-authenticated-github-token
            - github-checkout-app-superchain-ops
      # Forge checks.
      - forge_build:
          context:
            - circleci-repo-readonly-authenticated-github-token
            - github-checkout-app-superchain-ops
      - forge_fmt:
          context:
            - circleci-repo-readonly-authenticated-github-token
            - github-checkout-app-superchain-ops
      - forge_test:
          context:
            - circleci-repo-readonly-authenticated-github-token
            - circleci-repo-rpc-secrets
            - github-checkout-app-superchain-ops
      - template_regression_tests:
          context:
            - circleci-repo-readonly-authenticated-github-token
            - circleci-repo-rpc-secrets
            - github-checkout-app-superchain-ops
      - just_new_recipe_tests
      - shellcheck:
          context:
            - circleci-repo-readonly-authenticated-github-token
            - github-checkout-app-superchain-ops
      - check_task_names
      - check_struct_order
      - check_task_statuses:
          context:
            - circleci-repo-readonly-authenticated-github-token
            - github-checkout-app-superchain-ops
      # check that superchain-registry is up to date
      - check_superchain_registry:
          context:
            - circleci-repo-readonly-authenticated-github-token
            - github-checkout-app-superchain-ops

      # Stacked simulations for superchain-ops on Mainnet.
      - stacked_simulation:
          name: stacked_simulation_eth
          network: "eth"
          context:
            - circleci-repo-readonly-authenticated-github-token
            - circleci-repo-rpc-secrets
            - github-checkout-app-superchain-ops

      # Stacked simulations for superchain-ops on Sepolia.
      - stacked_simulation:
          name: stacked_simulation_sep
          network: "sep"
          mentions: "<!subteam^S07F1JJ80BW>"
          context:
            - circleci-repo-readonly-authenticated-github-token
            - circleci-repo-rpc-secrets
            - github-checkout-app-superchain-ops

  close-issue-workflow:
    when:
      and:
        - equal: [<< pipeline.trigger_source >>, "api"]
        - equal: [<< pipeline.parameters.github-event-type >>, "pull_request"]
        - equal: [<< pipeline.parameters.github-event-action >>, "labeled"]
    jobs:
      - close-issue:
          label_name: "auto-close-trivial-contribution"
          message: "Thank you for your interest in contributing!
            At this time, we are not accepting contributions that primarily fix spelling, stylistic, or grammatical errors in documentation, code, or elsewhere.
            Please check our [contribution guidelines](https://github.com/ethereum-optimism/optimism/blob/develop/CONTRIBUTING.md#contributions-related-to-spelling-and-grammar) for more information.
            This issue will be closed now."
          context:
            - circleci-repo-superchain-ops
