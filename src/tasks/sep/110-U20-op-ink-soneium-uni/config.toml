# Upgrade 20 (op-contracts/v8.0.0-rc.3) on OP Sepolia, Ink Sepolia, Soneium Minato and
# Unichain Sepolia.
#
# What this task does:
#   - Calls OPCMv2.upgradeSuperchain once, then OPCMv2.upgrade(...) for each chain,
#     using the op-contracts/v8.0.0-rc.3 OPCM.
#   - All four chains currently respect CANNON_KONA (8) (post-U19) and rotate to
#     SUPER_CANNON_KONA (9) — super roots replace output roots as the proofs
#     foundation. The retiring CANNON_KONA (8) and PERMISSIONED_CANNON (1) impls are
#     cleared, and the simplified SUPER_PERMISSIONED (5) game is installed as the
#     permissioned fallback (proposer-only args, no bond).
#
# Sequencing:
#   - The two mmzd tasks (105-mmzd-l1-ownership-transfers, 106-mmzd-l2pao-transfer)
#     have executed; no other pending task signs from these safes, so the nonce pins
#     below are the live values.
#   - Unichain Sepolia's ProxyAdminOwner transfer to the standard OP-governed Sepolia
#     L1PAO (0x1Eb2fFc903729a0F03966B917003800b145F56E2) is executed by the current
#     Unichain Safe OUTSIDE this repo. It has no signer overlap with the safes below,
#     so it does not affect these nonce pins, but it MUST have executed on-chain before
#     this task is signed. The [addresses] ProxyAdminOwner pin plus the two Unichain
#     owner state overrides below reproduce the post-transfer state in simulation.

l2chains = [
    {name = "OP Sepolia Testnet", chainId = 11155420},
    {name = "Ink Sepolia", chainId = 763373},
    {name = "Soneium Testnet Minato", chainId = 1946},
    {name = "Unichain Sepolia Testnet", chainId = 1301}
]

templateName = "OPCMUpgradeV800"
skipOPCMVersionCheck = false

[[opcmUpgrades]]
chainId = 11155420
# kona-client/v1.7.0-rc.2 `cannon64-kona-interop` prestate (superchain-registry
# validation/standard/standard-prestates.toml, added in superchain-registry PR #1328).
# Same value for every chain below; check-prestate reports all four chains up to date
# against the registry snapshot embedded in that kona release.
cannonKonaPrestate = "0x031ac6f15c19010da258f5cb633ef6ca9318c2d0f244bea6b2045ce6b790e1df"
# Single-chain super root at finalized L2 block 48523226 (timestamp 1788848992), computed on
# 2026-09-08 with `op-chain-ops/cmd/check-super-root --rpc-endpoints https://sepolia.optimism.io
# --timestamp 1788848992` and cross-checked by hand (keccak256 of the SuperV1 encoding over the
# block's output root). Re-derive from a trusted node close to signing.
startingAnchorRootRoot = "0x8645ee6c25c47e2297f9aad7ad3f96deb23a0f36386a5a5dbebad51f5c3b0c70"
startingAnchorRootL2SequenceNumber = 1788848992
expectedValidationErrors = ""
initBond = 80000000000000000
startingRespectedGameType = 9 # SUPER_CANNON_KONA

[[opcmUpgrades]]
chainId = 763373
cannonKonaPrestate = "0x031ac6f15c19010da258f5cb633ef6ca9318c2d0f244bea6b2045ce6b790e1df"
# Single-chain super root at finalized L2 block 59845048 (timestamp 1788848344), computed on
# 2026-09-08 with `op-chain-ops/cmd/check-super-root --rpc-endpoints https://rpc-gel-sepolia.inkonchain.com
# --timestamp 1788848344` and cross-checked by hand (keccak256 of the SuperV1 encoding over the
# block's output root). Re-derive from a trusted node close to signing.
startingAnchorRootRoot = "0xc2d853bc2a4da1e58018d75128bc07e23b899893b310bb99be1fc085b956830d"
startingAnchorRootL2SequenceNumber = 1788848344
expectedValidationErrors = ""
initBond = 80000000000000000
startingRespectedGameType = 9 # SUPER_CANNON_KONA

[[opcmUpgrades]]
chainId = 1946
cannonKonaPrestate = "0x031ac6f15c19010da258f5cb633ef6ca9318c2d0f244bea6b2045ce6b790e1df"
# Single-chain super root at finalized L2 block 32826879 (timestamp 1788848094), computed on
# 2026-09-08 with `op-chain-ops/cmd/check-super-root --rpc-endpoints https://rpc.minato.soneium.org
# --timestamp 1788848094` and cross-checked by hand (keccak256 of the SuperV1 encoding over the
# block's output root). Re-derive from a trusted node close to signing.
startingAnchorRootRoot = "0x96ba40829c288b59d96178b9e6cfe7a76a43da1a541e7338f327289630e4cbe7"
startingAnchorRootL2SequenceNumber = 1788848094
# Live validator output: Soneium uses a registry challenger override
# (0xB278818732E5BEbb742dc4Aa0617ccd1Dec76b65), reported informationally.
expectedValidationErrors = "OVERRIDES-CHALLENGER"
