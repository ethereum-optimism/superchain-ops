# Rollback of sep/112: restores the legacy batcher.
[sequencerConfig]
batcherAddress = "0x8F23BB38F531600e5d8FDDaAEC41F13FaB46E98c" # legacy batcher (sep/112 sets 0x64EDa4F93314ECd619bd4f79D8d1F8112A4E6e16)
